name: Crawl PBoC statistics

on:
  schedule:
    - cron: "0 8 * * 1,4"   # Monday and Thursday 08:00 UTC
  workflow_dispatch:
    inputs:
      years:
        description: "Number of most recent year sections to crawl (use more to backfill)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: crawl-pboc
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run crawler
        id: crawl
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py --years "${{ github.event.inputs.years || '1' }}"

      # Commit whatever succeeded, even if some files failed (they retry next run).
      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: PBoC crawl $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail if crawler reported errors
        if: steps.crawl.outcome == 'failure'
        run: exit 1
